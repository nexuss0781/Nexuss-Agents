<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Nexuss-Agent — a focused agentic AI playground for structured thinking." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/axolotl-favicon.png" />
    <link rel="apple-touch-icon" href="/axolotl-app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Nexuss-Agent — Agent Runtime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!/^https?:\/\/[^\s%]+$/i.test(endpoint) || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(websiteId)) return;
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.head.appendChild(analytics);
      })();
    </script>
  </body>
</html>
