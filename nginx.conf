server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Client-side routing: all unknown paths resolve to the React entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for Vite's hashed bundles and generated assets.
    location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Never cache the HTML shell so new deployments are picked up promptly.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/x-javascript
        image/svg+xml
        text/css
        text/plain
        text/xml;
}
