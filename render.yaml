services:
  - type: web
    name: nexuss-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: project-workspaces
      mountPath: /var/lib/nexuss-workspace
      sizeGB: 10
    envVars:
      - key: NEXUSS_WORKSPACE_ROOT
        value: /var/lib/nexuss-workspace
      - key: NEXUSS_AUTH_URL
        value: https://nexuss-auth.vercel.app
      - key: NEXUSS_AUTH_PROJECT_ID
        value: nexuss-agent-v2
      - key: NEXUSS_AUTH_REDIRECT_URI
        value: https://nexuss-agent.onrender.com/auth/callback
